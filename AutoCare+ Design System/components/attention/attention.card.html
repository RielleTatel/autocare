<!-- @dsCard group="Components" viewport="700x330" name="Attention" subtitle="AttentionCard summary + severity-edged item rows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink)}#root{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.lab{font:var(--type-label);color:var(--ac-ink-muted);text-transform:uppercase;letter-spacing:var(--ac-tracking-label);margin-bottom:6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { AttentionCard, AttentionItemRow } = window.AutoCareDesignSystem_2155ba;
const items=[
 {id:"1",severity:"CRITICAL",plate:"ABC 1234",title:"Front brake pads at 3.0 mm",body:"Replace within 1,000 km. Book a service and we'll collect the vehicle."},
 {id:"2",severity:"ATTENTION",plate:"ABC 1234",title:"Rear tyres at 4.0 mm tread",body:"Still legal, but plan replacement before the rainy season."},
 {id:"3",severity:"MONITOR",plate:"XYZ 8842",title:"Battery capacity 78%",body:"Within range. We'll re-check at the next inspection."},
 {id:"4",severity:"INFO",plate:"XYZ 8842",title:"Inspection due in 12 days",body:"Your plan covers two inspections this cycle; one is unused."}];
function Demo(){return (<>
<div><div class="lab">Summary card (M-10)</div><AttentionCard items={items} onSeeAll={()=>{}} onPressItem={()=>{}}/>
<div class="lab" style={{marginTop:14}}>Empty state</div><AttentionCard items={[]}/></div>
<div><div class="lab">List rows (M-38)</div><div style={{display:"flex",flexDirection:"column",gap:8}}>
{items.map(i=><AttentionItemRow key={i.id} {...i} showPlate/>)}
</div></div>
</>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
