<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);height:150px;box-sizing:border-box;padding:14px;overflow:hidden}.sw{flex:1;min-width:0;display:flex;flex-direction:column}.chip{height:46px;border-radius:6px}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}.r{font-size:11px;color:var(--ac-ink-muted)}.row{display:flex;gap:8px}</style></head><body><div class="row">
<div class="sw"><div style="height:76px;background:#fff;border:1px solid #D5DBE0;border-radius:12px"></div><div class="n">card</div><div class="h">1px line, no shadow</div></div>
<div class="sw"><div style="height:76px;background:#fff;border:1px solid #D5DBE0;border-radius:12px;box-shadow:0 1px 3px rgba(22,35,46,.08),0 1px 2px rgba(22,35,46,.04)"></div><div class="n">raised</div><div class="h">web login card only</div></div>

</div></body></html>
