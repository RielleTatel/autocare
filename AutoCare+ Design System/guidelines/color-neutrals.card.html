<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);height:140px;box-sizing:border-box;padding:14px;overflow:hidden}.sw{flex:1;min-width:0;display:flex;flex-direction:column}.chip{height:46px;border-radius:6px}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}.r{font-size:11px;color:var(--ac-ink-muted)}.row{display:flex;gap:8px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#16232E"></div><div class="n">ink</div><div class="h">#16232E</div><div class="r">primary text</div></div>
<div class="sw"><div class="chip" style="background:#51616F"></div><div class="n">ink-muted</div><div class="h">#51616F</div><div class="r">secondary text</div></div>
<div class="sw"><div class="chip" style="background:#EEF1F3"></div><div class="n">chassis</div><div class="h">#EEF1F3</div><div class="r">app background</div></div>
<div class="sw"><div class="chip" style="background:#FFF;border:1px solid #D5DBE0"></div><div class="n">surface</div><div class="h">#FFFFFF</div><div class="r">cards, sheets</div></div>
<div class="sw"><div class="chip" style="background:#D5DBE0"></div><div class="n">line</div><div class="h">#D5DBE0</div><div class="r">hairline borders</div></div>
<div class="sw"><div class="chip" style="background:#E4E9EC"></div><div class="n">code-bg</div><div class="h">#E4E9EC</div><div class="r">inline code</div></div>
</div></body></html>
