<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);height:150px;box-sizing:border-box;padding:14px;overflow:hidden}.sw{flex:1;min-width:0;display:flex;flex-direction:column}.chip{height:46px;border-radius:6px}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}.r{font-size:11px;color:var(--ac-ink-muted)}.row{display:flex;gap:8px}</style></head><body>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#E4E9EC;color:#16232E;border:1px solid transparent">DRAFT</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(14,90,167,.12);color:#0E5AA7;border:1px solid rgba(14,90,167,.35)">AWAITING APPROVAL</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(14,90,167,.12);color:#0E5AA7;border:1px solid rgba(14,90,167,.35)">IN PROGRESS</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(184,126,0,.14);color:#B87E00;border:1px solid rgba(184,126,0,.4)">PAST DUE</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(23,114,69,.12);color:#177245;border:1px solid rgba(23,114,69,.35)">PAID</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:rgba(194,55,44,.12);color:#C2372C;border:1px solid rgba(194,55,44,.35)">SUSPENDED</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#C2372C;color:#fff;border:1px solid transparent">NO SHOW</span><span style="font-family:var(--ac-font-mono);font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:#D5DBE0;color:#51616F;border:1px solid transparent">CANCELLED</span>
</div>
<div class="h" style="margin-top:14px">Work orders, invoices, trips, roadside and appointments all render their lifecycle this way. Band colours are never used here.</div>
</body></html>
