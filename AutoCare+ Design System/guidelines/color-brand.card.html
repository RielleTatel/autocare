<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);height:140px;box-sizing:border-box;padding:14px;overflow:hidden}.sw{flex:1;min-width:0;display:flex;flex-direction:column}.chip{height:46px;border-radius:6px}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}.r{font-size:11px;color:var(--ac-ink-muted)}.row{display:flex;gap:8px}</style></head><body><div class="row">

<div class="sw"><div class="chip" style="background:#0A2E4F"></div><div class="n">primary-deep</div><div class="h">#0A2E4F</div><div class="r">headers, field chrome, certificate footer</div></div>
<div class="sw"><div class="chip" style="background:#C2372C"></div><div class="n">danger</div><div class="h">#C2372C</div><div class="r">destructive actions</div></div>
<div class="sw"><div class="chip" style="background:#177245"></div><div class="n">success</div><div class="h">#177245</div><div class="r">confirmations</div></div>
</div></body></html>
