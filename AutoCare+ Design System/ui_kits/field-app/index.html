<!-- @startingPoint section="Field app" subtitle="Inspection flow for mechanics" viewport="430x900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>AutoCare+ · Field app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink)}
#root{display:flex;justify-content:center;padding:16px}
.phone{width:390px;height:844px;background:var(--ac-chassis);border:1px solid var(--ac-line);border-radius:var(--ac-radius-md);overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="TaskScreens.jsx"></script>
<script type="text/babel" src="InspectionScreens.jsx"></script>
<script type="text/babel">
function App(){
  const [v,setV]=React.useState("tasks");
  const back=(to)=>()=>setV(to);
  let screen;
  if(v==="tasks") screen=<TaskListScreen onStart={back("cats")} onQueue={back("queue")}/>;
  else if(v==="cats") screen=<CategoryNavScreen onBack={back("tasks")} onPoint={back("point")} onReview={back("review")}/>;
  else if(v==="point") screen=<PointEntryScreen onBack={back("cats")} onNext={back("review")}/>;
  else if(v==="review") screen=<ReviewScreen onBack={back("cats")} onSubmit={back("score")}/>;
  else if(v==="score") screen=<ScoreResultScreen onBack={back("tasks")}/>;
  else screen=<SyncQueueScreen onBack={back("tasks")}/>;
  return (
    <div className="phone">
      <SyncBanner pendingCount={3} onClick={back("queue")}/>
      <div className="scroll">{screen}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
