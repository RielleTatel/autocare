<script type="text/babel" src="data.jsx"></script>
<script>
(function(){
  var map={"house":"ic_house","car-front":"ic_car_front","calendar-days":"ic_calendar_days","user":"ic_user","chevron-left":"ic_chevron_left","chevron-right":"ic_chevron_right","calendar-plus":"ic_calendar_plus","phone":"ic_phone","share-2":"ic_share_2","trending-up":"ic_trending_up","list-tree":"ic_list_tree","plus":"ic_plus","map-pin":"ic_map_pin","battery-warning":"ic_battery_warning","disc-3":"ic_disc_3","fuel":"ic_fuel","circle-help":"ic_circle_help"};
  window.__acIconUrl=function(name){
    return (window.__resources||{})[map[name]]||("https://unpkg.com/lucide-static@0.544.0/icons/"+name+".svg");
  };
})();
</script>
<script type="text/babel">
window.Icon=function Icon(props){
  var size=props.size||20,color=props.color||"currentColor",url=window.__acIconUrl(props.name);
  return React.createElement("span",{"aria-hidden":true,role:"presentation","data-icon":props.name,style:Object.assign({
    display:"inline-block",width:size,height:size,flex:"none",backgroundColor:color,
    WebkitMaskImage:"url("+url+")",maskImage:"url("+url+")",
    WebkitMaskRepeat:"no-repeat",maskRepeat:"no-repeat",
    WebkitMaskSize:"contain",maskSize:"contain",
    WebkitMaskPosition:"center",maskPosition:"center"},props.style||{})});
};
</script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="HealthScoreScreen.jsx"></script>
<script type="text/babel" src="OtherScreens.jsx"></script>
<script type="text/babel" src="BookingFlow.jsx"></script>
<script type="text/babel" src="RoadsideScreens.jsx"></script>
<script type="text/babel">
const tabs=[{key:"home",label:"Home",icon:<Icon name="house" size={22}/>},
 {key:"vehicles",label:"Vehicles",icon:<Icon name="car-front" size={22}/>},
 {key:"bookings",label:"Bookings",icon:<Icon name="calendar-days" size={22}/>},
 {key:"account",label:"Account",icon:<Icon name="user" size={22}/>}];

function App(){
  const [tab,setTab]=React.useState("home");
  const [stack,setStack]=React.useState([]);
  const push=(s)=>setStack([...stack,s]);
  const pop=()=>setStack(stack.slice(0,-1));
  const top=stack[stack.length-1];
  let view;
  if(top==="attention") view=<AttentionListScreen onBack={pop}/>;
  else if(top==="score") view=<HealthScoreScreen onBack={pop} onBreakdown={()=>push("breakdown")} onShare={()=>push("share")}/>;
  else if(top==="breakdown") view=<BreakdownScreen onBack={pop}/>;
  else if(top==="share") view=<ShareCertificateScreen onBack={pop}/>;
  else if(top==="booking") view=<BookingFlow onBack={pop} onDone={()=>{setStack([]);setTab("bookings")}}/>;
  else if(top==="roadside") view=<RoadsideRequest onBack={pop} onSubmit={()=>setStack([...stack,"roadside-status"])}/>;
  else if(top==="roadside-status") view=<RoadsideStatus onBack={()=>setStack([])}/>;
  else if(tab==="home") view=<HomeScreen onSeeAll={()=>push("attention")} onBook={()=>push("booking")} onOpenVehicle={()=>push("score")} onRoadside={()=>push("roadside")}/>;
  else if(tab==="vehicles") view=<VehiclesScreen onOpenVehicle={()=>push("score")}/>;
  else if(top==="approval") view=<ApprovalScreen onBack={pop} onDone={pop}/>;
  else if(tab==="bookings") view=<BookingsScreen onBookNew={()=>push("booking")} onApprove={()=>push("approval")}/>;
  else view=<AccountScreen/>;
  return (
    <div className="phone">
      <div className="status"><span>9:41</span><span>AutoCare+</span><span>100%</span></div>
      <div className="scroll">{view}</div>
      <TabBar tabs={tabs} active={tab} onChange={(k)=>{setStack([]);setTab(k)}}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
