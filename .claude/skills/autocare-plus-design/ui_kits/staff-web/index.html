<!DOCTYPE html><html><head><meta charset="utf-8"><title>AutoCare+ · Staff console</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink)}
#root{min-height:100vh}main.page{padding:var(--ac-space-lg);max-width:1280px;margin:0 auto}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="StaffScreens.jsx"></script>
<script type="text/babel" src="AdminScreens.jsx"></script>
<script type="text/babel">
function App(){
  const [signedIn,setSignedIn]=React.useState(true);
  const [view,setView]=React.useState("Schedule");
  if(!signedIn) return <LoginScreen onSignIn={()=>setSignedIn(true)}/>;
  const admin=view==="Admin"||view==="Checklists";
  return (<>
    <TopBar console={admin?"admin console":"advisor desk"} nav={["Schedule","Work orders","Admin"]} active={view} onNav={setView} onSignOut={()=>setSignedIn(false)}/>
    <main className="page">
      {view==="Schedule"&&<ScheduleBoard/>}
      {view==="Work orders"&&<WorkOrderScreen/>}
      {view==="Admin"&&<AdminDashboard/>}
    </main>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
