<!-- @startingPoint section="Member app" subtitle="Member app home, health score and breakdown" viewport="430x900" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>AutoCare+ · Member app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink)}
#root{display:flex;justify-content:center;padding:16px}
.phone{width:390px;height:844px;background:var(--ac-chassis);border:1px solid var(--ac-line);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:24px;flex:none;background:var(--ac-surface);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style>
</head><body>
<script>Object.assign(window, window.AutoCareDesignSystem_85f2c0);</script><div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="HealthScoreScreen.jsx"></script>
<script type="text/babel" src="OtherScreens.jsx"></script>
<script type="text/babel" src="BookingFlow.jsx"></script>
<script type="text/babel" src="RoadsideScreens.jsx"></script>
<script type="text/babel">
const tabs=[{key:"home",label:"Home",icon:<Icon name="house" size={22}/>},
 {key:"vehicles",label:"Vehicles",icon:<Icon name="car-front" size={22}/>},
 {key:"bookings",label:"Bookings",icon:<Icon name="calendar-days" size={22}/>},
 {key:"account",label:"Account",icon:<Icon name="user" size={22}/>}];

function App(){
  const [tab,setTab]=React.useState("home");
  const [stack,setStack]=React.useState([]);
  const push=(s)=>setStack([...stack,s]);
  const pop=()=>setStack(stack.slice(0,-1));
  const top=stack[stack.length-1];
  let view;
  if(top==="attention") view=<AttentionListScreen onBack={pop}/>;
  else if(top==="score") view=<HealthScoreScreen onBack={pop} onBreakdown={()=>push("breakdown")} onShare={()=>push("share")}/>;
  else if(top==="breakdown") view=<BreakdownScreen onBack={pop}/>;
  else if(top==="share") view=<ShareCertificateScreen onBack={pop}/>;
  else if(top==="booking") view=<BookingFlow onBack={pop} onDone={()=>{setStack([]);setTab("bookings")}}/>;
  else if(top==="roadside") view=<RoadsideRequest onBack={pop} onSubmit={()=>setStack([...stack,"roadside-status"])}/>;
  else if(top==="roadside-status") view=<RoadsideStatus onBack={()=>setStack([])}/>;
  else if(tab==="home") view=<HomeScreen onSeeAll={()=>push("attention")} onBook={()=>push("booking")} onOpenVehicle={()=>push("score")} onRoadside={()=>push("roadside")}/>;
  else if(tab==="vehicles") view=<VehiclesScreen onOpenVehicle={()=>push("score")}/>;
  else if(top==="approval") view=<ApprovalScreen onBack={pop} onDone={pop}/>;
  else if(tab==="bookings") view=<BookingsScreen onBookNew={()=>push("booking")} onApprove={()=>push("approval")}/>;
  else view=<AccountScreen/>;
  return (
    <div className="phone">
      <div className="status"><span>9:41</span><span>AutoCare+</span><span>100%</span></div>
      <div className="scroll">{view}</div>
      <TabBar tabs={tabs} active={tab} onChange={(k)=>{setStack([]);setTab(k)}}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
