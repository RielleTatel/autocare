<!DOCTYPE html><html><head><meta charset="utf-8"><title>Core components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink)}
#root{padding:20px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font:var(--type-label);color:var(--ac-ink-muted);text-transform:uppercase;letter-spacing:var(--ac-tracking-label)}

</head><body><div id="root"></div><script>Object.assign(window, window.AutoCareDesignSystem_85f2c0);</script>
<script type="text/babel">
function Demo(){return(<div className="col">

  <Button variant="deep" icon={<Icon name="calendar-plus" size={18}/>}>Schedule</Button>
  <Button variant="danger">Request roadside</Button>
  <Button variant="ghost">Learn more</Button>
  <Button disabled>Approve work</Button>
 </div>
 <div className="row">
  <Button size="field" icon={<Icon name="camera" size={20}/>}>Take photo</Button>
  <span className="cap">field size &mdash; 56dp</span>
 </div>
 <div className="row" style={{alignItems:"stretch"}}>
  <Card style={{flex:1,minWidth:200}}><div style={{font:"var(--type-h2)"}}>Card</div><div style={{font:"var(--type-body)",color:"var(--ac-ink-muted)"}}>Radius 20, soft shadow.</div></Card>
  <Card major style={{flex:1,minWidth:200}}><div style={{font:"var(--type-h2)"}}>Card major</div><div style={{font:"var(--type-body)",color:"var(--ac-ink-muted)"}}>Radius 28, hero surfaces.</div></Card>
  <Card flat style={{flex:1,minWidth:200}}><div style={{font:"var(--type-h2)"}}>Card flat</div><div style={{font:"var(--type-body)",color:"var(--ac-ink-muted)"}}>Hairline, dense data.</div></Card>
 </div>
 <div className="row">

  <StatusPill tone="success">COMPLETED</StatusPill>
  <StatusPill tone="warn">AWAITING APPROVAL</StatusPill>
  <StatusPill tone="danger">CANCELLED</StatusPill>
  <StatusPill tone="solid">ACTIVE</StatusPill>
 </div>
 <div className="row">
  <Plate>ZMB 4821</Plate>
  <Plate variant="chip">ZMB 4821</Plate>
  <Plate variant="plain">MR0KX8CD1K0123456</Plate>
 </div>
 <div className="row" style={{alignItems:"flex-start"}}>
  <FormField id="p" label="Plate number" value="ZMB 4821" mono style={{flex:1,minWidth:220}}/>

 </div>

 </div>
 <div className="row">
  {["wrench","gauge","car-front","battery","droplet","disc","lightbulb","camera","bell","phone","calendar-days","user"].map(n=>(
   <Icon key={n} name={n} size={22} color="var(--ac-ink)"/>))}
 </div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
