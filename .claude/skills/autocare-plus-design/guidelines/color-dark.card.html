<!-- @dsCard group="Colors" viewport="700x130" name="Dark theme" subtitle="Neutrals shift; band fills never do — the same data on screen and in print" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);height:130px;box-sizing:border-box;padding:14px;overflow:hidden}.sw{flex:1;min-width:0;display:flex;flex-direction:column}.chip{height:46px;border-radius:6px}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--ac-font-mono);font-size:11px;color:var(--ac-ink-muted)}.r{font-size:11px;color:var(--ac-ink-muted)}.row{display:flex;gap:8px}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#101820"></div><div class="n">chassis</div><div class="h">#101820</div></div>
<div class="sw"><div class="chip" style="background:#1A242E"></div><div class="n">surface</div><div class="h">#1A242E</div></div>
<div class="sw"><div class="chip" style="background:#2C3947"></div><div class="n">line</div><div class="h">#2C3947</div></div>
<div class="sw"><div class="chip" style="background:#4C95DB"></div><div class="n">primary</div><div class="h">#4C95DB</div></div>
<div class="sw"><div class="chip" style="background:#E4EAEF;border:1px solid #D5DBE0"></div><div class="n">ink</div><div class="h">#E4EAEF</div></div>
<div class="sw"><div class="chip" style="background:#9AAAB6"></div><div class="n">ink-muted</div><div class="h">#9AAAB6</div></div>
</div></body></html>
