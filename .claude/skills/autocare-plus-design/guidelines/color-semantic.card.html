<!-- @dsCard group="Colors" viewport="700x150" name="Semantic actions" subtitle="Separate tokens from the band scale, on purpose" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--ac-surface);font-family:var(--ac-font-body);color:var(--ac-ink)}
.p{padding:20px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:80px;border-radius:var(--ac-radius-sm);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;height:88px}
.n{font-size:12px;font-weight:600;line-height:1.3}
.h{font-family:var(--ac-font-mono);font-size:11px;opacity:.8;line-height:1.4}
.cap{font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ac-ink-muted)}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style></head><body class="p"><div class="row"><div class="sw" style="background:#C2372C;color:#fff"><div class="n">danger</div><div class="h">#C2372C</div></div><div class="sw" style="background:#177245;color:#fff"><div class="n">success</div><div class="h">#177245</div></div><div class="sw" style="background:#E4E9EC;color:#16232E"><div class="n">code-bg</div><div class="h">#E4E9EC</div></div></div>
<p style="margin:12px 0 0;font-size:12px;color:var(--ac-ink-muted);max-width:560px">danger and success are deliberately different tokens from the band scale, so a red delete button can never be mistaken for a critical score.</p></body></html>
