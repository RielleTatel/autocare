<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--ac-surface);font-family:var(--ac-font-body);color:var(--ac-ink)}
.p{padding:20px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:80px;border-radius:var(--ac-radius-sm);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;height:88px}
.n{font-size:12px;font-weight:600;line-height:1.3}
.h{font-family:var(--ac-font-mono);font-size:11px;opacity:.8;line-height:1.4}
.cap{font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ac-ink-muted)}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style></head><body class="p"><div style="font-variant-numeric:tabular-nums;font:var(--type-h1)">₱1,499 &nbsp; 128,430 km &nbsp; 3.0 mm &nbsp; 12.45 V</div>
<p style="margin:10px 0 0;font-size:12px;color:var(--ac-ink-muted);max-width:560px">Money in pesos with the ₱ sign and thousands separators. Odometers with separators and a km suffix. Measurements with a space before the unit. Scores are integers 0–100.</p></body></html>
