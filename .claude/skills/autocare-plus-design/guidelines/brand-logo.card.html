<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="Mark and lockup — supplied Aug 2026, still subject to change" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{height:200px;box-sizing:border-box;padding:14px;background:var(--ac-chassis);font-family:var(--ac-font-body);color:var(--ac-ink);display:flex;gap:12px;overflow:hidden}
.cell{flex:1;border-radius:12px;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--ac-font-mono);font-size:10px;opacity:.7}
img{height:112px;width:auto;display:block}</style>
</head><body>
<div class="cell" style="background:var(--ac-surface);border:1px solid var(--ac-line)"><img src="../assets/logo-lockup.png" alt="AutoCare+ logo lockup"><span class="cap" style="color:var(--ac-ink-muted)">logo-lockup.png · on surface</span></div>
<div class="cell" style="background:var(--ac-surface);border:1px solid var(--ac-line)"><img src="../assets/logo-mark.png" alt="AutoCare+ mark"><span class="cap" style="color:var(--ac-ink-muted)">logo-mark.png · app icon</span></div>
<div class="cell" style="background:var(--ac-primary-deep)"><img src="../assets/logo-mark.png" alt="AutoCare+ mark on navy"><span class="cap" style="color:var(--ac-on-deep-meta)">on primary-deep</span></div>
</body></html>
