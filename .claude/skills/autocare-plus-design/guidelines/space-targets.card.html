<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="48dp member and web, 56dp field — a requirement, not a guideline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--ac-surface);font-family:var(--ac-font-body);color:var(--ac-ink)}
.p{padding:20px;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1;min-width:80px;border-radius:var(--ac-radius-sm);padding:10px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;height:88px}
.n{font-size:12px;font-weight:600;line-height:1.3}
.h{font-family:var(--ac-font-mono);font-size:11px;opacity:.8;line-height:1.4}
.cap{font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--ac-ink-muted)}
a{color:var(--ac-primary)}a:hover{color:var(--action-primary-hover)}</style></head><body class="p"><div class="row" style="align-items:center">
<div style="height:48px;min-width:180px;border-radius:var(--ac-radius-pill);background:var(--ac-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600">48dp · member / web</div>
<div style="height:56px;min-width:200px;border-radius:var(--ac-radius-pill);background:var(--ac-primary-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px">56dp · field</div></div>
<p style="margin:10px 0 0;font-size:12px;color:var(--ac-ink-muted)">Field targets assume gloves and direct sunlight (NFR-027).</p></body></html>
